name: "Data · QIB Allotment Desk"

# Ported from QIB_IPO_Allotement_Calculator/.github/workflows/update-ipos.yml (same schedule and steps).
on:
  schedule:
    # Hourly 09:05–19:05 IST on weekdays, plus 21:05 IST on weekdays and a daily 07:05 IST run
    - cron: "35 3-13 * * 1-5"
    - cron: "35 15 * * 1-5"
    - cron: "35 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/qib-desk/data/overrides.json", "apps/qib-desk/data/applications.json"]

permissions:
  contents: write

concurrency:
  group: data-qib-desk
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/qib-desk

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/qib-desk/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Scrape and update
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python -m scraper.update --offline; else python -m scraper.update; fi
      - name: Commit changes
        run: |
          ../../.github/scripts/commit-push.sh "data: QIB desk update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')" docs/data data/applications.json
