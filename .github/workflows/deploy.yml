name: Deploy FinDeependence Universe

# Publishes the whole Universe (shell + all 6 modules + latest data) to GitHub Pages.
# Runs on every push to main and after every data job, so new data goes live within minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Data · QIB Allotment Desk"
      - "Data · HNI IPO Ledger"
      - "Data · Deal Desk IPOs & GMP"
      - "Data · Deal Desk history"
      - "Data · Allotment Planner GMP"
      - "Data · Rights Issues"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Latest rights data (kept on its own branch so 15-minute refreshes don't bloat main)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: rights-data
          path: _rights
      - name: Assemble site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          if [ -f _rights/data/rights.json ]; then cp _rights/data/rights.json _site/apps/rights/data/rights.json; fi
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
